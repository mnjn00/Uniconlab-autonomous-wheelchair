name: Sync WP0 source hashes once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-wp0-hashes-once.yml'

permissions:
  contents: write

concurrency:
  group: sync-wp0-source-hashes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh committed hash bindings
        run: python3 tools/sync_wp0_hashes.py
      - name: Commit only when the strict chain changed
        run: |
          set -eu
          if git diff --quiet -- contracts/wp0/A15-evidence-inventory.yaml contracts/wp0/manifest.yaml; then
            echo 'WP0 hash chain is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/wp0/A15-evidence-inventory.yaml contracts/wp0/manifest.yaml
          git commit -m 'chore: refresh strict WP0 source hash bindings'
          git push origin HEAD:main

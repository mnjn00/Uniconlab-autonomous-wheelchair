# FAST-LIO for the MID360 lidar fused with the VectorNav VN-100 instead of
# the lidar's built-in IMU. Deployed to fast_lio_ws/src/FAST_LIO/config/;
# mid360.yaml (built-in IMU) is left untouched as the rollback.
#
# The extrinsics below are measured, not guessed: both IMUs were logged
# together for 150 s while the chair was rotated about all three axes
# (tools/solve_imu_extrinsic.py, tools/solve_lever_arm.py).
#   rotation  - gyro vectors aligned by SVD; residual 0.0144 rad/s,
#               gyro magnitude ratio 1.0009, and an independent gravity
#               cross-check agreeing to 0.56 deg
#   translation - lever arm from the two accelerometers' difference;
#               condition number 1.2, residual 0.337 m/s^2
#   result    - VN sits 14.4 cm behind, 2.2 cm to the side and 6.7 cm
#               below the lidar, yawed -2.80 deg (roll/pitch under 0.4)
#
# extrinsic_T/R follow FAST-LIO's Lidar_wrt_IMU convention: the lidar
# origin expressed in the IMU frame, NOT the IMU's position.
common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/vectornav/IMU"
    # Measured, not assumed: header stamps on /vectornav/IMU and
    # /livox/imu trail rospy.Time.now() by 0.08 ms and 0.16 ms, so both
    # drivers stamp on arrival and the VN inherits the exact timing
    # relationship the built-in IMU was validated with. Zero is therefore
    # still correct. (The lidar's own ~100 ms stamp lag is the start of
    # its accumulation window, which FAST-LIO already resolves through
    # per-point offset times - do NOT enter it here.)
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
    scan_line: 4
    blind: 0.5

mapping:
    # Left at the built-in IMU's values on purpose: the VN-100 is the
    # quieter sensor, so these are conservative, and changing the noise
    # model at the same time as the sensor would make a regression
    # impossible to attribute. Retune only after the swap is validated.
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360
    det_range:     100.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
    extrinsic_T: [ 0.14465, -0.01507, 0.06811 ]
    extrinsic_R: [ 0.998785, -0.048796, -0.006840,
                   0.048776, 0.998805, -0.003054,
                   0.006981, 0.002716, 0.999972 ]

publish:
    path_en:  false
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    pcd_save_en: true
    interval: 100                 # how many LiDAR frames saved in each pcd file;
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

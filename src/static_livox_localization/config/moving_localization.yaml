# pcl_gicp is the validated CPU fallback. fast_vgicp_cuda is accepted only
# when the workspace was built with -DENABLE_FAST_GICP_CUDA=ON; requesting it
# from a CPU-only build terminates the node instead of silently changing the
# localization algorithm.
registration_backend: pcl_gicp
voxel_resolution: 0.20
# 8 m covered barely more than the ground immediately around the chair,
# which on open pavement is close to featureless for a horizontal fix. At
# 20 m the target carries the buildings and kerbs that actually constrain
# the pose: measured on the chair, the inlier ratio went from 0.19 to
# 0.44 at the same place, and held 0.53-0.79 while driving.
roi_radius: 20.0
roi_z_half_extent: 5.0
max_correspondence: 0.5
max_iterations: 64
min_points: 500
# Validated on 2026-07-31: two complete autonomous runs of the 0727 route,
# 1446 points end to end, 154 samples taken while actually driving.
#
#   inlier_ratio  0.9666 .. 1.0000  (mean 0.9949)   gate 0.20
#   fitness       0.0137 .. 0.0329  (mean 0.0219)   gate 0.28
#   state         TRACKING for every driving sample in both runs
#
# The two runs agree to within 0.0006 on both means, which is what makes
# this a measurement rather than one lucky lap. Worst case leaves 4.8x the
# inlier gate and 8.5x under the fitness ceiling, so these thresholds are
# nowhere near binding on this route - they are sized for a worse day.
#
# One thing they do NOT cover: while PARKED at the goal 20 minutes after
# run 2 finished, the fix degraded to inlier 0.124-0.262 and crossed this
# gate four times, with fitness still inside its ceiling at 0.186-0.229. So
# the end of the route is the weakest geometry on it. Nothing was driving,
# and the driving envelope above is untouched by it, but a stage that ends
# by holding position there should expect DEGRADED and not read it as new.
max_fitness: 0.28
min_inlier_ratio: 0.20

max_prediction_translation_m: 1.5
max_prediction_yaw_deg: 20.0
max_correction_translation_m: 0.20
max_correction_yaw_deg: 2.0
# Relaxed 2026-08-12 after four field runs in which these, and not the
# quality gates above, were what held the chair. The gates were never close:
# the worst SUCCESSFUL registration of the day scored fitness 0.034 against
# the 0.28 ceiling, and the moment localization was declared lost the inlier
# ratio was 0.40 against the 0.20 floor. Both passed. So none of max_fitness
# or min_inlier_ratio is touched here - loosening a gate that is not binding
# buys nothing and spends real margin.
#
# degraded_after_failures 1 -> 3. A single non-converged registration used to
# declare DEGRADED. 15 % of attempts fail to converge on this route, and 21 of
# 30 DEGRADED episodes cleared inside the follower's 3 s grace on their own -
# so most of what this fired on was noise. Cost: a genuine loss is now
# declared about two registrations (~2 s) later.
degraded_after_failures: 3
# 8 s was short enough that any hold longer than it left the state machine
# primed to declare LOST on the first imperfect registration afterwards.
# note_unobserved now discounts parked time, but the margin was still thin.
# Cost is bounded by the follower, which holds on DEGRADED after 3 s and
# therefore stops the chair long before this expires.
lost_after_s: 20.0
# One good registration returns to TRACKING instead of two. Cost: a single
# lucky match can restore tracking, which is why degraded_after_failures
# above went up rather than down - the pair is meant to be asymmetric.
recovery_confirmations: 1

auto_correction_on_start: false
required_consistent_candidates: 3
# 0.30 -> 0.50. This is the one that actually blocked re-acquisition at
# wp 836 on 2026-08-12: the localizer had a fix every cycle but consecutive
# candidates scattered further than 0.30 m, so three never agreed and it sat
# in VERIFYING / CANDIDATE_INCONSISTENT until it went LOST. This is the most
# consequential relaxation here - a re-acquired fix may now settle up to
# 0.5 m from where a tighter consensus would have put it - and it is the
# first thing to put back if a run comes up in the wrong place.
candidate_translation_tolerance_m: 0.50
candidate_yaw_tolerance_deg: 3.0


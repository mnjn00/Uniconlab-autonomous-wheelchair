<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="UNICON 상용화 준비도 발표자료의 정적 디자인 프리미티브 쇼케이스">
    <title>UNICON 상용화 준비도 — 프리미티브 쇼케이스</title>
    <link rel="stylesheet" href="./assets/deck.css">
  </head>
  <body>
    <main class="showcase-page">
      <header class="showcase-intro">
        <p>DESIGN SYSTEM FOUNDATION · STATIC SHOWCASE</p>
        <h1>UNICON 상용화 준비도 프리미티브</h1>
        <p>모든 예시는 720pt × 405pt 고정 프레임이며, 실제 슬라이드가 아닌 재사용 가능한 구조와 상태 변형을 검증합니다.</p>
      </header>

      <div class="showcase-grid">
        <figure class="showcase-item">
          <figcaption class="showcase-label">01 · FRAME / HEADER / SOURCE / EVIDENCE / KPI</figcaption>
          <section class="slide-frame" aria-labelledby="showcase-title-01">
            <header class="slide-header">
              <p class="slide-kicker">FOUNDATION 01 · 기본 해부</p>
              <h1 class="slide-title" id="showcase-title-01">결론이 먼저 보이고, 근거와 출처가 같은 읽기 순서에 놓입니다</h1>
            </header>
            <div class="slide-hairline" aria-hidden="true"></div>
            <div class="slide-content">
              <article class="kpi-card grid-span-4">
                <p class="module-label">중립 KPI</p>
                <strong class="kpi-value">12</strong>
                <p class="module-copy">선택되지 않은 수치는 잉크색으로 유지합니다.</p>
              </article>
              <article class="evidence-module grid-span-4">
                <p class="module-label">읽기 순서</p>
                <h2 class="module-title">액션 타이틀 다음 근거</h2>
                <p class="module-copy">주제명이 아니라 회의에서 남길 결론 문장을 먼저 읽습니다.</p>
              </article>
              <article class="kpi-card grid-span-4" data-accent-target="true">
                <p class="module-label">유일한 파랑 목표</p>
                <strong class="kpi-value">1</strong>
                <p class="module-copy">한 슬라이드에서 의사결정 핵심 하나만 강조합니다.</p>
              </article>
            </div>
            <footer class="slide-source">출처: design-diversity-data.js:18–120 · DESIGN.slides.md</footer>
          </section>
        </figure>

        <figure class="showcase-item">
          <figcaption class="showcase-label">02 · EVIDENCE MODULE VARIANTS</figcaption>
          <section class="slide-frame" aria-labelledby="showcase-title-02">
            <header class="slide-header">
              <p class="slide-kicker">FOUNDATION 02 · 근거 모듈 상태</p>
              <h1 class="slide-title" id="showcase-title-02">근거 상태는 색이 아니라 라벨·순서·선 굵기로도 구분됩니다</h1>
            </header>
            <div class="slide-hairline" aria-hidden="true"></div>
            <div class="slide-content">
              <article class="evidence-module grid-span-4">
                <p class="module-label">확인됨</p>
                <h2 class="module-title">검사한 범위</h2>
                <p class="module-copy">근거가 직접 확인한 사실만 짧게 기록합니다.</p>
              </article>
              <article class="evidence-module grid-span-4">
                <p class="module-label">알 수 없음</p>
                <h2 class="module-title">근거 밖의 범위</h2>
                <p class="module-copy">미확인은 부재가 아니라 추가 확인이 필요한 상태입니다.</p>
              </article>
              <article class="evidence-module grid-span-4" data-accent-target="true">
                <p class="module-label">통과 조건</p>
                <h2 class="module-title">다음 권한의 문턱</h2>
                <p class="module-copy">명시한 증거를 충족하기 전에는 권한을 열지 않습니다.</p>
              </article>
            </div>
            <footer class="slide-source">출처: consulting-precision-grid-constraints.md · Section 3</footer>
          </section>
        </figure>

        <figure class="showcase-item">
          <figcaption class="showcase-label">03 · DECISION CARD / CAVEAT STRIP</figcaption>
          <section class="slide-frame" aria-labelledby="showcase-title-03">
            <header class="slide-header">
              <p class="slide-kicker">FOUNDATION 03 · 결정과 해석 경계</p>
              <h1 class="slide-title" id="showcase-title-03">출시 권한과 검증 프로그램 범위는 서로 다른 결정입니다</h1>
            </header>
            <div class="slide-hairline" aria-hidden="true"></div>
            <div class="slide-content">
              <div class="decision-pair">
                <article class="decision-card" data-accent-target="true">
                  <p class="decision-target">출시 권한</p>
                  <h2 class="decision-title">NO-GO · 출시 보류</h2>
                  <p class="decision-copy">승객·캠퍼스·제한 pilot 권한은 열지 않습니다.</p>
                </article>
                <article class="decision-card">
                  <p class="decision-target">검증 프로그램</p>
                  <h2 class="decision-title">GO · 범위 승인</h2>
                  <p class="decision-copy">각 Gate의 증거를 충족한 뒤 다음 실행 권한을 별도로 엽니다.</p>
                </article>
              </div>
              <aside class="caveat-strip">
                <h2 class="caveat-label">해석 경계</h2>
                <p class="caveat-copy">근거에서 확인되지 않음은 실물에 기능이 없다는 뜻이 아니지만, 출시 승인 근거로 쓸 수는 없습니다.</p>
              </aside>
            </div>
            <footer class="slide-source">출처: slide-outline.md · Slide 1, Slide 14</footer>
          </section>
        </figure>

        <figure class="showcase-item">
          <figcaption class="showcase-label">04 · LEDGER / TABLE SEMANTICS</figcaption>
          <section class="slide-frame" aria-labelledby="showcase-title-04">
            <header class="slide-header">
              <p class="slide-kicker">FOUNDATION 04 · 근거 ledger</p>
              <h1 class="slide-title" id="showcase-title-04">세 상태를 같은 표에서 읽되, 다음 통과 조건 하나만 강조합니다</h1>
            </header>
            <div class="slide-hairline" aria-hidden="true"></div>
            <div class="slide-content">
              <section class="ledger-wrap" aria-labelledby="ledger-heading">
                <h2 class="ledger-title" id="ledger-heading">최종 모터 권한 chain 확인표</h2>
                <p class="ledger-summary">라벨이 의미를 전달하고, 파랑 선은 선택된 결론을 보조합니다.</p>
                <table class="ledger">
                  <caption>최대 다섯 행, 고정 header, 왼쪽 정렬, 우하단 별도 출처</caption>
                  <thead>
                    <tr>
                      <th scope="col">상태</th>
                      <th scope="col">현재 근거</th>
                      <th scope="col">읽는 방법</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <th scope="row">확인됨</th>
                      <td>소프트웨어 RC 경로</td>
                      <td class="ledger-meta">검사 범위 안</td>
                    </tr>
                    <tr>
                      <th scope="row">알 수 없음</th>
                      <td>저장소 밖 구동부 동작</td>
                      <td class="ledger-meta">부재로 단정하지 않음</td>
                    </tr>
                    <tr data-accent-target="true">
                      <th scope="row">통과 조건</th>
                      <td>actuator까지 단일 권한과 정지 측정</td>
                      <td class="ledger-meta">다음 Gate의 증거</td>
                    </tr>
                  </tbody>
                </table>
              </section>
            </div>
            <footer class="slide-source">출처: consulting-precision-grid-constraints.md · Table application</footer>
          </section>
        </figure>

        <figure class="showcase-item">
          <figcaption class="showcase-label">05 · TWO-LANE DIAGRAM / SQUARE NODE / CONNECTOR</figcaption>
          <section class="slide-frame" aria-labelledby="showcase-title-05">
            <header class="slide-header">
              <p class="slide-kicker">FOUNDATION 05 · 권한 chain</p>
              <h1 class="slide-title" id="showcase-title-05">두 경로는 같은 회색 문법으로 그리고, 검증 단절점만 표시합니다</h1>
            </header>
            <div class="slide-hairline" aria-hidden="true"></div>
            <div class="slide-content">
              <figure class="diagram-panel" aria-labelledby="diagram-heading">
                <figcaption>
                  <h2 class="diagram-title" id="diagram-heading">소프트웨어 RC와 현재 field 경로</h2>
                </figcaption>
                <img
                  class="tldraw-diagram"
                  src="./assets/authority-chain.svg"
                  alt="검증 경로와 현장 경로의 세 단계 권한 chain. 현장 경로의 외부 base_model이 검증 단절점으로 선택됨."
                  data-accent-target="true"
                >
                <div class="visually-hidden">
                  <h3>검증 경로</h3>
                  <ol>
                    <li>Gate: 권한 확인</li>
                    <li>Governor: 정책 적용</li>
                    <li>/cmd_vel_safe: simulation 종료</li>
                  </ol>
                  <h3>현장 경로</h3>
                  <ol>
                    <li>Field gate: 별도 경로</li>
                    <li>외부 base_model: 검증 단절점</li>
                    <li>Actuator: 물리 근거 필요</li>
                  </ol>
                </div>
                <p class="diagram-summary">읽기 요약: 최종 actuator까지 같은 서명·해시·정지 근거로 연결해야 합니다.</p>
              </figure>
            </div>
            <footer class="slide-source">출처: slide-outline.md · Slide 4, Slide 5</footer>
          </section>
        </figure>

        <figure class="showcase-item">
          <figcaption class="showcase-label">06 · GATE TIMELINE</figcaption>
          <section class="slide-frame" aria-labelledby="showcase-title-06">
            <header class="slide-header">
              <p class="slide-kicker">FOUNDATION 06 · Gate 0–5</p>
              <h1 class="slide-title" id="showcase-title-06">다음 Gate는 앞 단계의 증거를 충족한 뒤에만 열립니다</h1>
            </header>
            <div class="slide-hairline" aria-hidden="true"></div>
            <div class="slide-content">
              <figure class="timeline-panel" aria-labelledby="timeline-heading">
                <figcaption>
                  <h2 class="timeline-title" id="timeline-heading">검증 프로그램과 실행 권한을 분리한 단계</h2>
                </figcaption>
                <img
                  class="tldraw-diagram"
                  src="./assets/gate-timeline.svg"
                  alt="Gate 0부터 Gate 5까지의 권한 흐름. Gate 1 단일 chain이 다음 필수 단계로 선택됨."
                  data-accent-target="true"
                >
                <ol class="visually-hidden">
                  <li>Gate 0 현재: Truth 동결</li>
                  <li>Gate 1 다음 필수: 단일 chain</li>
                  <li>Gate 2 증거 뒤: NUC HIL</li>
                  <li>Gate 3 별도 권한: 무승객 코스</li>
                  <li>Gate 4 미래: 제품 검증</li>
                  <li>Gate 5 검토: 제한 pilot</li>
                </ol>
                <div class="gate-scope">
                  <p class="gate-scope-label">Gate 0–3 프로그램 범위 승인 · Gate 3 실행 권한은 Gate 1–2 증거 통과 뒤 별도 결정</p>
                </div>
                <p class="timeline-summary">범위 bracket은 프로그램 계획을 뜻하며, 뒤 Gate의 실행 권한을 미리 열지 않습니다.</p>
              </figure>
            </div>
            <footer class="slide-source">출처: slide-outline.md · Slide 13</footer>
          </section>
        </figure>
      </div>
    </main>
  </body>
</html>
